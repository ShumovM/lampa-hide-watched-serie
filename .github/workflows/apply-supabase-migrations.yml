name: Apply Supabase migrations to Lampa

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: Apply pending SQL migrations to the Lampa Supabase project
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-migrations-lampa
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main' && inputs.confirm_apply
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 3.4.0

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF secret"; exit 1; }

      - name: Prepare temporary CLI config
        shell: bash
        run: |
          if [[ ! -f supabase/config.toml && ! -f supabase/config.json && ! -f supabase/config.jsonc ]]; then
            printf 'project_id = "%s"\n' "$SUPABASE_PROJECT_REF" > supabase/config.toml
          fi

      - name: Apply pending migrations to Lampa
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --yes
